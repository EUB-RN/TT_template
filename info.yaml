# Tiny Tapeout project information
project:
  title:        "Analog 2x2 Placeholder"   # Project title
  author:       "wer-eng"                  # Your name
  discord:      ""                         # Your discord username (optional)
  description:  "Placeholder for a 2x2 analog tile - layout to be added before the deadline"
  language:     "Analog"                   # other examples include Verilog, Amaranth, VHDL, etc
  clock_hz:     0                          # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "2x2"          # Valid values for analog projects: 1x2, 2x2
                        # 2x2 on sky130A = 334.88 x 225.76 um

  # How many analog pins does your project use?
  analog_pins: 2        # Valid values: 0 to 6. Must match what you pre-purchased!
  uses_vapwr: false     # true if you also use the second analog supply (VAPWR, 3.3V)
                        # -> if you set this true, build from def/tt_analog_2x2_3v3.def

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_wereng_analog_2x2"

  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: ""
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: ""
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

  # Analog pins - make sure to also set "analog_pins" above, else the pins won't be connected
  ua[0]: "analog in (TBD)"
  ua[1]: "analog out (TBD)"
  ua[2]: ""
  ua[3]: ""
  ua[4]: ""
  ua[5]: ""

# Do not change!
yaml_version: 6
