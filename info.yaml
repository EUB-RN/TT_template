# Tiny Tapeout project information
project:
  title:        "smartDense-tt-1a"         # Project title
  author:       "wer-eng, BekirYufka"      # Your name
  discord:      ""                         # Your discord username (optional)
  description:  "A 5-register RV32E CPU running from an FPGA-emulated PSRAM, with a SAR ADC and a small FPGA fabric island"
  language:     "SystemVerilog"            # other examples include Verilog, Amaranth, VHDL, etc
  clock_hz:     20000000                   # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values for analog projects: 1x2, 2x2

  # How many analog pins does your project use?
  analog_pins: 1        # Valid values: 0 to 6. Must match what you pre-purchased!
  uses_vapwr: false     # true if you also use the second analog supply (VAPWR, 3.3V)

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_wereng_analog_2x2"

  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "UART RX"
  ui[1]: "FPGA pad_in[0]"
  ui[2]: "FPGA pad_in[1]"
  ui[3]: "ADC debug select (uo[7])"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: "ADC external start"

  # Outputs
  uo[0]: "UART TX"
  uo[1]: "FPGA pad_out[0]"
  uo[2]: "FPGA pad_out[1]"
  uo[3]: "ADC dbg_start"
  uo[4]: "ADC sdo_valid"
  uo[5]: "ADC eoc"
  uo[6]: "ADC sdo"
  uo[7]: "ADC dbg_busy / dbg_outp"

  # Bidirectional pins
  uio[0]: "PSRAM IO0"
  uio[1]: "PSRAM IO1"
  uio[2]: "PSRAM IO2"
  uio[3]: "PSRAM IO3"
  uio[4]: "PSRAM CS#"
  uio[5]: "PSRAM SCK"
  uio[6]: "FPGA pad_io[0]"
  uio[7]: "FPGA pad_io[1]"

  # Analog pins - make sure to also set "analog_pins" above, else the pins won't be connected
  ua[0]: "ADC input"
  ua[1]: ""
  ua[2]: ""
  ua[3]: ""
  ua[4]: ""
  ua[5]: ""

# Do not change!
yaml_version: 6
